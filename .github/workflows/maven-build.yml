name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up 64-bit Corretto 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          architecture: x64
          cache: maven

      - name: Run unit tests
        run: SPRING_PROFILES_ACTIVE=test mvn -B -ntp test
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  integration:
    if: ${{ vars.JOB_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up 64-bit Corretto 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          architecture: x64
          cache: maven

      - name: Run Spring SDK (java-spring6) integration tests
        run: cd java-spring6 && mvn -B -ntp verify -Dgpg.skip
        env:
          BLINKPAY_DEBIT_URL: https://sandbox.debit.blinkpay.co.nz
          BLINKPAY_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          BLINKPAY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          BLINKPAY_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Run Plain Java SDK (java-v2) integration tests
        run: cd java-v2 && mvn -B -ntp verify -Dgpg.skip
        env:
          BLINKPAY_DEBIT_URL: https://sandbox.debit.blinkpay.co.nz
          BLINKPAY_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          BLINKPAY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up 64-bit Corretto 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          architecture: x64
          cache: maven

      - name: Run Sonar on blink-debit-api-client-java to inspect code
        run: >
          SPRING_PROFILES_ACTIVE=test
          mvn -B -ntp -pl .,java-v2 verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -DskipITs
          -Dgpg.skip
          -Dsonar.projectKey=blink-debit-api-client-java
          -Dsonar.organization=blinkpay
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.junit.reportPaths=target/surefire-reports
          -Dsonar.projectName=blink-debit-api-client-java
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Sonar on blink-debit-api-client-java-spring6 to inspect code
        run: >
          SPRING_PROFILES_ACTIVE=test
          mvn -B -ntp -pl .,java-spring6 verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -DskipITs
          -Dgpg.skip
          -Dsonar.projectKey=blink-debit-api-client-java-spring6
          -Dsonar.organization=blinkpay
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.junit.reportPaths=target/surefire-reports
          -Dsonar.projectName=blink-debit-api-client-java-spring6
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SPRING6_SONAR_TOKEN }}